<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16405a"/><stop offset="1" stop-color="#0f2a3a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- ship hull on the left, with portholes -->
  <path d="M0 80 H162 V380 Q162 420 122 432 H0 Z" fill="#eaf2f0"/>
  <path d="M0 360 H162 V380 Q162 420 122 432 H0 Z" fill="#c9d8d5"/>
  <rect x="0" y="80" width="162" height="24" fill="#f2b705"/>
  <circle cx="44" cy="150" r="13" fill="#16405a"/><circle cx="98" cy="150" r="13" fill="#16405a"/>
  <!-- doorway the gangway leaves from -->
  <rect x="110" y="196" width="52" height="92" rx="8" fill="#0f2a3a"/>
  <!-- sea -->
  <path d="M0 420 H512 V512 H0 Z" fill="#1f7a8c"/>
  <path d="M0 438 q32 -14 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#5fb7c7" stroke-width="8" stroke-linecap="round"/>
  <!-- pier -->
  <rect x="352" y="386" width="160" height="34" fill="#eaf2f0"/>
  <!-- gangway deck as an exit arrow running from the door down to the pier -->
  <path d="M162 284 L330 368 L318 394 L150 310 Z" fill="#f2b705"/>
  <path d="M300 336 L392 392 L290 418 Z" fill="#f2b705"/>
  <!-- handrail -->
  <path d="M162 236 L322 316" stroke="#f2b705" stroke-width="10" stroke-linecap="round"/>
  <path d="M200 255 V303 M246 278 V326 M292 301 V349" stroke="#f2b705" stroke-width="8" stroke-linecap="round"/>
</svg>
