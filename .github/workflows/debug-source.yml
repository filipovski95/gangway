name: Debug schedule source
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Source keys, space separated"
        required: true
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q selenium
          sudo apt-get install -y -qq poppler-utils >/dev/null
          cd tools && python debug_source.py ${{ github.event.inputs.keys }}
