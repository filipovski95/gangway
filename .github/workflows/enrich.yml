name: Add Wikipedia details
on:
  workflow_dispatch:
    inputs:
      ports:
        description: "Port ids to enrich, space separated (empty = ports not done yet)"
        required: false
        default: ""
      all:
        description: "Redo every port"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: data-${{ github.ref }}
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PORTS: ${{ github.event.inputs.ports }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Add descriptions and photos
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then export ENRICH_ALL=1; fi
          python tools/enrich.py $PORTS
      - name: Commit data
        if: always()
        run: |
          git config user.name "gangway-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add Wikipedia descriptions and photos"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
