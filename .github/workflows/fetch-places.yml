name: Fetch port places
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Run part i of n in parallel, as i/n (empty = all)"
        required: false
        default: ""
      all:
        description: "Refetch every port (keeps old data when a port fails)"
        type: boolean
        default: false
      ships_only:
        description: "Only update ship schedules from port websites"
        type: boolean
        default: false
      wiki_only:
        description: "Only add Wikipedia descriptions and photos (no map fetch)"
        type: boolean
        default: false
      ship_photos:
        description: "Only find photos of cruise ships on Wikipedia"
        type: boolean
        default: false
      ports:
        description: "Port ids to refetch, space separated (empty = only ports missing data)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"   # weekly refresh of opening hours and new places
    - cron: "30 4 * * *"  # daily ship schedules from port authorities
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SHARD: ${{ github.event.inputs.shard }}
      PORTS: ${{ github.event.inputs.ports }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set git identity
        run: |
          git config user.name "gangway-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Fetch places (only ports missing data; weekly run refreshes all)
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * 1" ] || [ "${{ github.event.inputs.all }}" = "true" ]; then export REFRESH_ALL=1; fi
          if [ "${{ github.event.inputs.ships_only }}" = "true" ] || [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then pip install -q selenium; python tools/port_schedules.py; python tools/ship_photos.py || true; exit 0; fi
          if [ "${{ github.event.inputs.ship_photos }}" = "true" ]; then python tools/ship_photos.py; exit 0; fi
          if [ "${{ github.event.inputs.wiki_only }}" = "true" ]; then python tools/enrich.py $PORTS; exit 0; fi
          python tools/fetch_places.py $PORTS
          if [ -z "$SHARD" ]; then python tools/countries.py; python tools/enrich.py $PORTS; fi
      - name: Commit data
        if: always()
        run: |
          git add data
          git diff --cached --quiet || git commit -m "Update port places from OpenStreetMap"
          git pull --rebase || true
          git push || true
