name: Fetch port places
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Run part i of n in parallel, as i/n (empty = all)"
        required: false
        default: ""
      ports:
        description: "Port ids to refetch, space separated (empty = only ports missing data)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"   # weekly refresh of opening hours and new places
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SHARD: ${{ github.event.inputs.shard }}
      PORTS: ${{ github.event.inputs.ports }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set git identity
        run: |
          git config user.name "gangway-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Fetch places (only ports missing data; weekly run refreshes all)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then export REFRESH_ALL=1; fi
          python tools/fetch_places.py $PORTS
          if [ -z "$SHARD" ]; then python tools/countries.py; fi
      - name: Commit data
        if: always()
        run: |
          git add data
          git diff --cached --quiet || git commit -m "Update port places from OpenStreetMap"
          git pull --rebase || true
          git push || true
