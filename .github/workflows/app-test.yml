name: Test Gangway app
on:
  push:
    paths: ["app/**", "data/**", "tools/app_test.js", ".github/workflows/app-test.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Assemble the web app exactly as the Android build does
        run: |
          mkdir -p www && cp -r app/. www/ && cp -r data www/data
          python3 -c "import json,os;p='www/data/index.json';d=json.load(open(p));d['ports']=[x for x in d['ports'] if os.path.exists('www/data/ports/'+x['id']+'.json')];json.dump(d,open(p,'w'),separators=(',',':'))"
      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Run the app test on a phone-sized screen
        run: node tools/app_test.js www test-out
      - name: Publish screenshots and report to the "App test results" release
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view app-test-results >/dev/null 2>&1 || gh release create app-test-results --title "App test results" --notes "Latest cloud test of the app: report.txt and screenshots." --prerelease
          gh release upload app-test-results test-out/* --clobber
