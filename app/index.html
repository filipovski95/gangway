<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Plume</title>
<meta name="theme-color" content="#F7F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140E1B" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Plume: a calm GLP-1 companion. Warm cream paper, deep plum, a pop of lime.
   Bento cards, big confident numbers, soft rounded shapes. Follows the phone's light/dark setting. */
:root {
  --bg: #F7F3EE;
  --card: #FFFFFF;
  --card-2: #FBF8F4;
  --ink: #1E1428;
  --muted: #7A6E85;
  --line: #ECE5EF;
  --plum: #4B2270;
  --plum-2: #7B3FB0;
  --lilac: #EFE6FB;
  --lilac-ink: #5B2A86;
  --lime: #D8F264;
  --lime-ink: #1E2A00;
  --peach: #FF8A5C;
  --peach-soft: #FFE8DD;
  --aqua: #3FB5D6;
  --aqua-soft: #DDF3FA;
  --mint: #2FB383;
  --mint-soft: #DBF5EA;
  --rose: #E85B7E;
  --rose-soft: #FDE3EA;
  --shadow: 0 1px 2px #1e142810, 0 10px 30px #1e14280d;
  --radius: 26px;
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #140E1B;
    --card: #1F1729;
    --card-2: #251C31;
    --ink: #F5EFFA;
    --muted: #A99BB8;
    --line: #30253D;
    --plum: #2A1540;
    --plum-2: #6A34A0;
    --lilac: #2E2142;
    --lilac-ink: #D9C5F5;
    --peach-soft: #3A2421;
    --aqua-soft: #15303A;
    --mint-soft: #13322A;
    --rose-soft: #3A1C27;
    --shadow: 0 1px 2px #0006, 0 10px 30px #0004;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; }
body { min-height: 100vh; overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
.num { font-feature-settings: "tnum" 1; letter-spacing: -0.03em; }
svg { display: block; }

/* ---------- App shell ---------- */
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--top) + 12px) var(--gut) calc(var(--bottom) + 120px); }
.head { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 18px; }
.head h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.035em; margin: 0; line-height: 1.05; }
.head .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--lilac); color: var(--lilac-ink); display: grid; place-items: center; font-weight: 600; font-size: 17px; }
.section-title { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 26px 4px 10px; }

.card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.bento .wide { grid-column: 1 / -1; }
.label { font-size: 13px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.big { font-size: 34px; font-weight: 600; line-height: 1; margin-top: 10px; }
.big small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 3px; }

/* ---------- Hero: next shot ---------- */
.hero { background: radial-gradient(120% 140% at 100% 0%, var(--plum-2) 0%, var(--plum) 55%, #2A0F45 100%); color: #fff; padding: 22px; border-radius: 30px; box-shadow: 0 14px 40px #4b227040; }
.hero .label { color: #E6D8F7; }
.hero-row { display: flex; align-items: center; gap: 18px; }
.hero .count { font-size: 46px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; margin: 10px 0 6px; }
.hero .count small { font-size: 18px; color: #E6D8F7; font-weight: 500; letter-spacing: 0; margin: 0 6px 0 2px; }
.hero .when { color: #E6D8F7; font-size: 14px; }
.hero .ring { flex: none; }
.hero .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: #ffffff1c; color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 16px; transition: transform .12s ease; }
.btn:active { transform: scale(.97); }
.btn-lime { background: var(--lime); color: var(--lime-ink); }
.btn-plum { background: var(--plum-2); color: #fff; }
.btn-ghost { background: var(--lilac); color: var(--lilac-ink); }
.btn-line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-block { width: 100%; }
.btn-sm { height: 38px; padding: 0 14px; font-size: 14px; }
.hero .btn { margin-top: 18px; width: 100%; }
.hero.overdue { background: radial-gradient(120% 140% at 100% 0%, #B04A7A 0%, #6E2457 55%, #3D0F33 100%); }

/* ---------- Protein / water ---------- */
.ring-wrap { position: relative; width: 92px; height: 92px; margin: 12px auto 4px; }
.ring-wrap .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-wrap .center b { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; display: block; line-height: 1; }
.ring-wrap .center span { font-size: 11px; color: var(--muted); }
.quick { display: flex; gap: 6px; margin-top: 12px; }
.quick button { flex: 1; height: 36px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.q-peach { background: var(--peach-soft); color: #C2501F; }
.q-aqua { background: var(--aqua-soft); color: #1C7F9C; }
@media (prefers-color-scheme: dark) { .q-peach { color: #FFB394; } .q-aqua { color: #8ED8EC; } }
.cups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.cup { height: 30px; border-radius: 9px 9px 12px 12px; background: var(--aqua-soft); position: relative; overflow: hidden; }
.cup.full::after { content: ""; position: absolute; inset: 0; top: 18%; background: linear-gradient(180deg, #7AD3EA, var(--aqua)); border-radius: 6px 6px 12px 12px; }

/* ---------- Feeling chips ---------- */
.chips-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px; background: var(--card-2); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; font-weight: 500; }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip.good { background: var(--mint-soft); box-shadow: none; }
.chip .e { font-size: 15px; }

/* ---------- Lists ---------- */
.list { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; font-size: 18px; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; font-size: 15px; }
.row .t span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { color: var(--muted); font-size: 13px; text-align: right; flex: none; }
.row .r b { color: var(--ink); font-size: 15px; display: block; }
.empty { text-align: center; color: var(--muted); padding: 34px 20px; font-size: 15px; }
.empty .e { font-size: 34px; display: block; margin-bottom: 8px; }

.seg { display: flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); margin-bottom: 14px; }
.seg button { flex: 1; height: 40px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ---------- Progress ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: var(--card-2); border-radius: 18px; padding: 12px; }
.stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; }
.stat span { font-size: 12px; color: var(--muted); }
.bar { height: 12px; border-radius: 999px; background: var(--lilac); overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--plum-2), #B07BE8); }
.ranges { display: flex; gap: 6px; }
.ranges button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--card-2); }
.ranges button.on { background: var(--lime); color: var(--lime-ink); }
.chart { margin-top: 14px; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.hbar { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
.hbar .n { width: 120px; flex: none; }
.hbar .track { flex: 1; height: 10px; background: var(--rose-soft); border-radius: 999px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--rose); border-radius: 999px; }
.hbar .c { width: 26px; text-align: right; color: var(--muted); font-size: 13px; }
.steps { position: relative; margin-top: 8px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.step .b { width: 12px; height: 12px; border-radius: 50%; background: var(--plum-2); margin-top: 4px; flex: none; box-shadow: 0 0 0 4px var(--lilac); }
.step b { font-weight: 600; }
.step span { color: var(--muted); font-size: 13px; display: block; }

/* Pro lock overlay */
.locked { position: relative; }
.locked > .blur { filter: blur(6px); opacity: .55; pointer-events: none; }
.lock { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
.lock .btn { margin-top: 10px; }
.pro-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--lime); color: var(--lime-ink); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; letter-spacing: .04em; }

/* ---------- Nav ---------- */
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom) + 14px); width: min(calc(100% - 2 * var(--gut)), 420px); height: 68px; background: var(--ink); border-radius: 999px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; box-shadow: 0 12px 34px #1e142840; z-index: 20; }
.nav[hidden], .backdrop[hidden] { display: none; }
.nav button { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #9E92AB; }
@media (prefers-color-scheme: dark) { .nav { background: #F5EFFA; } .nav button { color: #7A6E85; } }
.nav button.on { color: var(--bg); }
.nav button.on::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--lime); bottom: 6px; left: calc(50% - 2.5px); }
.nav .fab { width: 58px; height: 58px; background: var(--lime); color: var(--lime-ink); box-shadow: 0 6px 18px #d8f26455; }
.nav .fab svg { transition: transform .2s ease; }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; background: #140e1b80; opacity: 0; transition: opacity .22s ease; z-index: 40; }
.backdrop.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 30px 30px 0 0; padding: 10px var(--gut) calc(var(--bottom) + 22px); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.25,1); z-index: 41; max-height: 92vh; overflow-y: auto; }
.sheet.show { transform: translateY(0); }
.grab { width: 44px; height: 5px; border-radius: 999px; background: var(--line); margin: 4px auto 14px; }
.sheet h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 4px; }
.sheet .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.field { margin-top: 16px; }
.field > label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 4px 8px; }
.input { width: 100%; height: 52px; border-radius: 16px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); padding: 0 16px; font-size: 17px; outline: none; -webkit-user-select: text; user-select: text; }
.input:focus { box-shadow: inset 0 0 0 2px var(--plum-2); }
textarea.input { height: 84px; padding: 14px 16px; resize: none; }
.input-unit { position: relative; }
.input-unit span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { padding: 10px 14px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 500; font-size: 15px; }
.opt.on { background: var(--plum-2); color: #fff; box-shadow: none; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days .opt { padding: 12px 0; text-align: center; font-size: 14px; }
.sev { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sev .opt { text-align: center; padding: 14px 0; }
.actions { display: flex; gap: 10px; margin-top: 22px; }
.actions .btn { flex: 1; }
.qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.qa { background: var(--card); border-radius: 22px; padding: 16px; text-align: left; box-shadow: var(--shadow); }
.qa .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; margin-bottom: 10px; }
.qa b { display: block; font-weight: 600; }
.qa span { font-size: 13px; color: var(--muted); }

/* Body map for injection sites */
.bodymap { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 22px; padding: 12px; box-shadow: inset 0 0 0 1.5px var(--line); }
.bodymap svg { width: 140px; flex: none; }
.bodymap .silhouette { fill: var(--lilac); }
.site-dot { cursor: pointer; }
.site-dot circle.hit { fill: transparent; }
.site-dot circle.d { fill: var(--card); stroke: var(--plum-2); stroke-width: 2.5; transition: all .15s; }
.site-dot.sugg circle.d { fill: var(--lime); stroke: var(--lime-ink); }
.site-dot.on circle.d { fill: var(--plum-2); stroke: var(--plum-2); }
.site-list { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.site-list button { text-align: left; padding: 9px 12px; border-radius: 12px; font-size: 14px; font-weight: 500; background: var(--card-2); }
.site-list button.on { background: var(--plum-2); color: #fff; }
.site-list button small { display: block; font-size: 11px; opacity: .7; font-weight: 400; }
.tag-sugg { font-size: 10px; font-weight: 700; background: var(--lime); color: var(--lime-ink); padding: 2px 6px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; }

/* ---------- Onboarding ---------- */
.ob { min-height: calc(100vh - var(--top) - var(--bottom) - 40px); display: flex; flex-direction: column; }
.ob .progress { display: flex; gap: 6px; margin: 4px 0 26px; }
.ob .progress i { flex: 1; height: 5px; border-radius: 999px; background: var(--line); }
.ob .progress i.on { background: var(--plum-2); }
.ob h1 { font-size: 34px; letter-spacing: -0.04em; line-height: 1.05; margin: 0 0 10px; font-weight: 600; }
.ob p.lead { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 0 0 8px; }
.ob .grow { flex: 1; }
.ob .foot { padding-top: 20px; }
.welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.logo-big { width: 96px; height: 96px; border-radius: 30px; background: radial-gradient(120% 120% at 100% 0%, var(--plum-2), var(--plum)); display: grid; place-items: center; box-shadow: 0 16px 40px #4b227050; margin-bottom: 28px; }
.welcome h1 { font-size: 44px; }
.perks { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 12px; }
.perks li { display: flex; gap: 12px; align-items: center; font-size: 15px; font-weight: 500; }
.perks li .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.fine { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 14px; text-align: center; }

/* ---------- Settings ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 16px; width: 100%; text-align: left; font-size: 15px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .v { color: var(--muted); font-size: 14px; }
.toggle { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px #0003; }
.toggle.on { background: var(--mint); }
.toggle.on::after { transform: translateX(20px); }
.pro-card { background: radial-gradient(130% 140% at 0% 0%, #EAF9A8 0%, var(--lime) 60%); color: var(--lime-ink); border-radius: 28px; padding: 22px; }
.pro-card h3 { margin: 6px 0 4px; font-size: 24px; letter-spacing: -0.03em; }
.pro-card p { margin: 0; font-size: 14px; opacity: .8; }
.pro-card ul { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; font-size: 14px; font-weight: 500; }
.pro-card .btn { background: var(--lime-ink); color: var(--lime); width: 100%; }
.pro-card .price { font-size: 13px; text-align: center; margin-top: 8px; opacity: .75; }
.disclaimer { color: var(--muted); font-size: 12px; line-height: 1.5; padding: 18px 6px 0; text-align: center; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--bottom) + 96px); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; transition: all .25s ease; z-index: 60; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.fade-in { animation: fade .3s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
.pop { animation: pop .3s ease; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" hidden>
  <button data-tab="today" aria-label="Today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-tab="history" aria-label="History"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
  <button class="fab" data-action="quick" aria-label="Add"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="progress" aria-label="Progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></button>
  <button data-tab="me" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</nav>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Plume: GLP-1 tracker. Everything is stored on the phone (localStorage).
   ============================================================ */

const STORE_KEY = "plume.v1";
const PRO_PRICE = "$4.99";
const TEST_BUILD = true; // purchases aren't wired to Google Play yet; "Unlock" just turns Pro on locally.

const MEDS = {
  "Zepbound":   { kind: "tirzepatide", doses: ["2.5 mg", "5 mg", "7.5 mg", "10 mg", "12.5 mg", "15 mg"] },
  "Mounjaro":   { kind: "tirzepatide", doses: ["2.5 mg", "5 mg", "7.5 mg", "10 mg", "12.5 mg", "15 mg"] },
  "Wegovy":     { kind: "semaglutide", doses: ["0.25 mg", "0.5 mg", "1 mg", "1.7 mg", "2.4 mg"] },

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const DAY = 86400000;
const fmtDate = (d, opts = { month: "short", day: "numeric" }) => new Date(d).toLocaleDateString("en-US", opts);
const fmtTime = d => new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const fmtNum = (n, dp = 1) => (Math.round(n * 10 ** dp) / 10 ** dp).toLocaleString("en-US", { maximumFractionDigits: dp });
function relDay(ts) {
  const a = parseDay(dayKey(new Date(ts))), b = parseDay(dayKey());
  const diff = Math.round((b - a) / DAY);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 7) return DAY_LONG[a.getDay()];
  return fmtDate(a);
}
function ago(ts) {
  const d = Math.floor((Date.now() - ts) / DAY);
  if (d <= 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 14) return d + " days ago";
  return Math.floor(d / 7) + " weeks ago";
}
function greet() {
  const h = new Date().getHours();
  return h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}
function today() { const k = dayKey(); return S.days[k] || (S.days[k] = { protein: 0, water: 0 }); }

/* ---------- Shot schedule ---------- */
function lastShot() { return S.shots.reduce((a, s) => (!a || s.ts > a.ts ? s : a), null); }
function occurrenceAfter(after) {
  // First moment strictly after `after` that falls on the shot weekday at the shot time.
  const [h, m] = S.settings.shotTime.split(":").map(Number);
  const d = new Date(after); d.setHours(h, m, 0, 0);
  let add = (S.settings.shotDay - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + add);
  if (d <= after) d.setDate(d.getDate() + 7);
  return d;
}
function shotStatus() {
  const now = new Date(), last = lastShot();
  let due;
  if (last) {
    // A shot logged up to a few days early or late still counts for that week.
    due = occurrenceAfter(new Date(last.ts + 3.5 * DAY));
  } else {
    const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
    due = occurrenceAfter(new Date(startOfToday.getTime() - 1));
  }
  const ms = due - now;
  const frac = Math.min(1, Math.max(0, 1 - ms / (7 * DAY)));
  return { due, ms, overdue: ms < 0, frac, last };
}
function countdownParts(ms) {
  ms = Math.abs(ms);
  const d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / 3600000), m = Math.floor((ms % 3600000) / 60000);
  if (d > 0) return [[d, "d"], [h, "h"]];
  if (h > 0) return [[h, "h"], [m, "m"]];
  return [[m, "m"]];
}
function siteHistory() {
  const lastUse = {};
  [...S.shots].sort((a, b) => a.ts - b.ts).forEach(s => { if (s.site) lastUse[s.site] = s.ts; });
  return lastUse;
}
function suggestedSite() {
  const lu = siteHistory();
  // Never-used sites first (in body order), then the one rested longest.
  return [...SITES].sort((a, b) => (lu[a.id] || 0) - (lu[b.id] || 0))[0].id;
}
const siteLabel = id => (SITES.find(s => s.id === id) || {}).label || "—";
function weeksOnTrack() {
  // Consecutive weeks (ending with the latest shot) where shots were no more than 10 days apart.
  const t = S.shots.map(s => s.ts).sort((a, b) => b - a);
  if (!t.length) return 0;
  if (Date.now() - t[0] > 10 * DAY) return 0;
  let n = 1;
  for (let i = 1; i < t.length; i++) { if (t[i - 1] - t[i] <= 10 * DAY) n++; else break; }
  return n;
}

/* ---------- Weight ---------- */
const sortedWeights = () => [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
function weightStats() {
  const w = sortedWeights();
  if (!w.length) return null;
  const start = w[0].value, cur = w[w.length - 1].value, goal = S.settings.goalWeight;
  const lost = start - cur;
  let pct = null;
  if (goal && start > goal) pct = Math.max(0, Math.min(100, (lost / (start - goal)) * 100));
  return { start, cur, lost, goal, pct, first: w[0], latest: w[w.length - 1], list: w };
}

/* ---------- SVG bits ---------- */
function ring(size, stroke, frac, color, track) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, frac)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease"/></svg>`;
}

function lineChart(points, opts = {}) {
  // points: [{x: Date, y: number}]
  const W = 320, H = 170, P = { l: 34, r: 10, t: 12, b: 24 };
  if (points.length < 2) return `<div class="empty"><span class="e">📈</span>Log your weight a couple of times to see your trend.</div>`;
  const xs = points.map(p => +p.x), ys = points.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + DAY;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (opts.goal != null) { y0 = Math.min(y0, opts.goal); y1 = Math.max(y1, opts.goal); }
  const padY = Math.max(1, (y1 - y0) * 0.15); y0 -= padY; y1 += padY;
  const X = x => P.l + ((x - x0) / (x1 - x0)) * (W - P.l - P.r);
  const Y = y => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const pts = points.map(p => [X(+p.x), Y(p.y)]);
  // Smooth curve (Catmull-Rom to Bezier)
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  const area = `${d} L${pts[pts.length - 1][0]},${H - P.b} L${pts[0][0]},${H - P.b} Z`;
  const ticks = [y0 + padY, (y0 + y1) / 2, y1 - padY].map(v => `<text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v)}</text>
      <line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join("");
  const goal = opts.goal != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}" stroke="var(--mint)" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="${W - P.r}" y="${Y(opts.goal) - 5}" text-anchor="end" style="fill:var(--mint);font-weight:600">Goal ${fmtNum(opts.goal)}</text>` : "";
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">
    <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B3FB0" stop-opacity=".28"/><stop offset="1" stop-color="#7B3FB0" stop-opacity="0"/></linearGradient></defs>
    ${ticks}${goal}
    <path d="${area}" fill="url(#gArea)"/>
    <path d="${d}" fill="none" stroke="var(--plum-2)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--lime)" stroke="var(--plum-2)" stroke-width="3"/>
    <text x="${P.l}" y="${H - 6}">${fmtDate(x0)}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}

}

/* ---------- Progress ---------- */
function viewProgress() {
  const s = S.settings, ws = weightStats(), pro = s.pro;
  const ranges = [["1m", "1M", 30], ["3m", "3M", 91], ["all", "All", 1e5]];
  const r = ranges.find(x => x[0] === range) || ranges[0];
  const needsPro = !pro && range !== "1m";
  const since = Date.now() - r[2] * DAY;
  const pts = ws ? ws.list.filter(w => parseDay(w.date) >= since).map(w => ({ x: parseDay(w.date), y: w.value })) : [];
  const chart = lineChart(pts, { goal: s.goalWeight });

  // Dose journey
  const doseSteps = [];
  [...S.shots].sort((a, b) => a.ts - b.ts).forEach(sh => {
    const key = sh.med + "|" + sh.dose, lastStep = doseSteps[doseSteps.length - 1];
    if (!lastStep || lastStep.key !== key) doseSteps.push({ key, med: sh.med, dose: sh.dose, from: sh.ts, n: 1 });
    else lastStep.n++;
  });

  // Symptoms, last 30 days
  const recent = S.effects.filter(e => e.ts > Date.now() - 30 * DAY && e.type !== "great");
  const counts = {};
  recent.forEach(e => counts[e.type] = (counts[e.type] || 0) + 1);
  const max = Math.max(1, ...Object.values(counts));
  const goodDays = new Set(S.effects.filter(e => e.ts > Date.now() - 30 * DAY && e.type === "great").map(e => dayKey(new Date(e.ts)))).size;
  // Symptoms by days after shot (Pro insight)
  const byDay = Array(7).fill(0);
  S.effects.filter(e => e.type !== "great").forEach(e => {
    const prior = S.shots.filter(sh => sh.ts <= e.ts).sort((a, b) => b.ts - a.ts)[0];
    if (prior) { const dd = Math.floor((e.ts - prior.ts) / DAY); if (dd >= 0 && dd < 7) byDay[dd]++; }
  });
  const peak = byDay.indexOf(Math.max(...byDay));
  const hasPattern = byDay.some(v => v > 0);

  const symptomsHTML = Object.keys(counts).length
    ? Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, c]) => {
        const def = EFFECTS.find(x => x.id === k) || { e: "", label: k };
        return `<div class="hbar"><span class="n">${def.e} ${esc(def.label)}</span><span class="track"><i style="width:${(c / max) * 100}%"></i></span><span class="c">${c}</span></div>`;
      }).join("")
    : `<div style="color:var(--muted);font-size:14px;margin-top:10px">No symptoms logged in the last 30 days.</div>`;

  const insight = `<div class="card" style="margin-top:12px">
      <div class="label">Pattern after your shot <span class="pro-badge">PRO</span></div>
      <div class="${pro ? "" : "locked"}"><div class="${pro ? "" : "blur"}">
        <div style="display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:14px">
          ${byDay.map((v, i) => `<div style="flex:1;text-align:center"><div style="height:${(v / Math.max(1, ...byDay)) * 60 + 4}px;background:${i === peak && hasPattern ? "var(--rose)" : "var(--rose-soft)"};border-radius:8px"></div><div style="font-size:11px;color:var(--muted);margin-top:4px">D${i + 1}</div></div>`).join("")}
        </div>
        <div style="font-size:14px;margin-top:10px">${hasPattern ? `Symptoms tend to peak on <b>day ${peak + 1}</b> after your shot. Plan lighter meals and extra water then.` : "Log how you feel for a couple of weeks and Plume will show when symptoms usually hit."}</div>
      </div>${pro ? "" : `<div class="lock"><div><b>See when symptoms hit</b><br><button class="btn btn-plum btn-sm" data-action="pro">Unlock Pro</button></div></div>`}</div>
    </div>`;

  return `<div class="head"><div><h1>Progress</h1><div class="sub">Every small step counts</div></div></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="label"><span class="dot" style="background:var(--plum-2)"></span>Weight</div>
      <div class="ranges">${ranges.map(([k, l]) => `<button class="${range === k ? "on" : ""}" data-action="range" data-v="${k}">${l}${!pro && k !== "1m" ? " 🔒" : ""}</button>`).join("")}</div>
    </div>
    ${needsPro ? `<div class="locked"><div class="blur">${chart}</div><div class="lock"><div><b>Your full history</b><br><span style="font-size:14px;color:var(--muted)">See every month of progress</span><br><button class="btn btn-plum btn-sm" data-action="pro">Unlock Pro</button></div></div></div>` : chart}
    ${ws ? `<div class="stats">
      <div class="stat"><b class="num">${fmtNum(ws.start)}</b><span>Start</span></div>
      <div class="stat"><b class="num">${fmtNum(ws.cur)}</b><span>Now</span></div>
      <div class="stat"><b class="num" style="color:${ws.lost >= 0 ? "var(--mint)" : "var(--rose)"}">${ws.lost >= 0 ? "−" : "+"}${fmtNum(Math.abs(ws.lost))}</b><span>${s.unit} ${ws.lost >= 0 ? "lost" : "gained"}</span></div>
    </div>` : ""}
  </div>

  <div class="section-title">Dose journey</div>
  <div class="card">${doseSteps.length ? `<div class="steps">${doseSteps.reverse().map(d => `<div class="step"><span class="b"></span><div><b>${esc(d.med)} · ${esc(d.dose)}</b><span>Since ${fmtDate(d.from, { month: "short", day: "numeric", year: "numeric" })} · ${d.n} shot${d.n > 1 ? "s" : ""}</span></div></div>`).join("")}</div>` : `<div style="color:var(--muted);font-size:14px">Your doses will show here as you log shots.</div>`}</div>

  <div class="section-title">Last 30 days</div>
  <div class="card">
    <div class="label"><span class="dot" style="background:var(--rose)"></span>Symptoms ${goodDays ? `<span style="margin-left:auto;color:var(--mint);font-weight:600">✨ ${goodDays} great day${goodDays > 1 ? "s" : ""}</span>` : ""}</div>
    ${symptomsHTML}
  </div>
  ${insight}

  <div class="section-title">Doctor visit</div>
  <button class="card" data-action="report" style="width:100%;text-align:left;display:flex;gap:14px;align-items:center">
    <div class="ic" style="width:46px;height:46px;border-radius:15px;background:var(--lilac);display:grid;place-items:center;font-size:22px">🩺</div>
    <div style="flex:1"><b style="display:block">Share a summary ${pro ? "" : `<span class="pro-badge">PRO</span>`}</b><span style="font-size:13px;color:var(--muted)">Doses, weight and symptoms in one tidy note</span></div>
    <span style="font-size:20px;color:var(--muted)">›</span>
  </button>`;
}

function readObInputs() {
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  if (obStep === 1) { const d = v("ob-dose"); if (d) ob.dose = d; }
  if (obStep === 2) { const t = v("ob-time"); if (t) ob.shotTime = t; }
  if (obStep === 3) {
    ob.weight = v("ob-weight") ?? ob.weight;

    const p = parseInt(v("ob-protein"), 10); if (p > 0) ob.proteinGoal = p;
    ob.name = v("ob-name") ?? ob.name;
  }
}

    ${def.good ? "" : `<div class="sev">${SEVERITY.map((l, i) => `<button class="opt ${cur.sev === i ? "on" : ""}" data-action="pick-sev" data-v="${i}">${l}</button>`).join("")}</div>`}
    <div class="field"><label>Note (optional)</label><input class="input" id="e-note" placeholder="${def.good ? "e.g. slept well, walked 30 min" : "e.g. after a big lunch"}" value="${esc(cur.note)}"></div>
    <div class="actions">${existing ? `<button class="btn btn-line" data-action="del-effect" data-id="${existing.id}" style="color:var(--rose)">Delete</button>` : ""}<button class="btn btn-plum" data-action="save-effect" data-id="${existing ? existing.id : ""}">Save</button></div>
    ${def.good ? "" : `<div class="fine">Severe or worrying symptoms? Contact your doctor or pharmacist.</div>`}`, sheetCtx);
}
function sheetEffectPick() {
  openSheet(`<h2>How are you feeling?</h2><p class="hint">Pick one. You can log more than one a day.</p>
    <div class="chips-row">${EFFECTS.map(e => `<button class="chip ${e.good ? "good" : ""}" data-action="effect" data-type="${e.id}"><span class="e">${e.e}</span>${e.label}</button>`).join("")}</div>`);
}

function sheetMed() {
  const s = S.settings;
  sheetCtx = { med: s.med, dose: s.dose };
  const draw = () => {
    const doses = (MEDS[sheetCtx.med] || MEDS.Other).doses;
    openSheet(`<h2>Medication</h2><p class="hint">Changing your dose? New shots will be logged at the new dose.</p>
      <div class="field"><label>Medication</label><div class="opts">${Object.keys(MEDS).map(m => `<button class="opt ${sheetCtx.med === m ? "on" : ""}" data-action="med-pick" data-v="${esc(m)}">${esc(m)}</button>`).join("")}</div></div>
      <div class="field"><label>Dose</label>${doses.length ? `<div class="opts">${doses.map(d => `<button class="opt ${sheetCtx.dose === d ? "on" : ""}" data-action="med-dose" data-v="${esc(d)}">${esc(d)}</button>`).join("")}</div>` : ""}
        <input class="input" id="med-custom" placeholder="Or type a dose" value="${doses.includes(sheetCtx.dose) ? "" : esc(sheetCtx.dose)}" style="margin-top:10px"></div>
      <div class="actions"><button class="btn btn-plum" data-action="med-save">Save</button></div>`, sheetCtx);
  };
  sheetCtx.redraw = draw;
  draw();
}
function sheetSchedule() {
  const s = S.settings;
  sheetCtx = { shotDay: s.shotDay };
  const draw = () => openSheet(`<h2>Shot day</h2><p class="hint">Pick the day and time you usually take your shot.</p>
    <div class="field"><label>Day</label><div class="days">${DAY_SHORT.map((d, i) => `<button class="opt ${sheetCtx.shotDay === i ? "on" : ""}" data-action="sched-day" data-v="${i}">${d}</button>`).join("")}</div></div>
    <div class="field"><label>Time</label><input class="input" type="time" id="sched-time" value="${esc(s.shotTime)}"></div>
    <div class="actions"><button class="btn btn-plum" data-action="sched-save">Save</button></div>`, sheetCtx);
  sheetCtx.redraw = draw;
  draw();
}
function sheetGoals() {
  const s = S.settings;
  sheetCtx = { unit: s.unit };
  const draw = () => openSheet(`<h2>Goals</h2><p class="hint">Set targets that feel doable. You can always adjust.</p>
    <div class="field"><label>Units</label><div class="opts"><button class="opt ${sheetCtx.unit === "lb" ? "on" : ""}" data-action="goal-unit" data-v="lb">Pounds (lb)</button><button class="opt ${sheetCtx.unit === "kg" ? "on" : ""}" data-action="goal-unit" data-v="kg">Kilograms (kg)</button></div></div>
    <div class="grid2">
      <div class="field"><label>Protein / day</label><div class="input-unit"><input class="input" id="g-protein" inputmode="numeric" value="${s.proteinGoal}"><span>g</span></div></div>
      <div class="field"><label>Water / day</label><div class="input-unit"><input class="input" id="g-water" inputmode="numeric" value="${s.waterGoal}"><span>cups</span></div></div>
    </div>
    <div class="field"><label>Goal weight</label><div class="input-unit"><input class="input" id="g-weight" inputmode="decimal" placeholder="Optional" value="${s.goalWeight != null ? fmtNum(convert(s.goalWeight, s.unit, sheetCtx.unit)).replace(/,/g, "") : ""}"><span>${sheetCtx.unit}</span></div></div>
    <div class="actions"><button class="btn btn-plum" data-action="goals-save">Save</button></div>`, sheetCtx);
  sheetCtx.redraw = draw;
  draw();
}
function convert(v, from, to) { if (v == null || from === to) return v; return to === "kg" ? v / 2.20462 : v * 2.20462; }
function sheetName() {
  openSheet(`<h2>Your name</h2><p class="hint">Used for your greeting only.</p>
    <div class="field"><input class="input" id="n-val" placeholder="First name" value="${esc(S.settings.name)}"></div>
    <div class="actions"><button class="btn btn-plum" data-action="name-save">Save</button></div>`);
}
function sheetPro() {
  if (S.settings.pro) { toast("You already have Pro 💚"); return; }
  openSheet(`<div class="pro-card" style="margin-top:4px">
      <span class="pro-badge" style="background:var(--lime-ink);color:var(--lime)">PLUME PRO</span>
      <h3>Pay once. Yours forever.</h3><p>No subscription. No ads. Ever.</p>
      <ul><li>📈 Full weight history and trends</li><li>🔎 When symptoms hit after your shot</li><li>🩺 Doctor-ready summary to share</li><li>💚 Support an indie developer</li></ul>
      <button class="btn" data-action="buy">Unlock for ${PRO_PRICE}</button>
      <div class="price">One-time purchase</div></div>
    <button class="btn btn-line btn-block" data-action="close" style="margin-top:12px">Maybe later</button>`);
}
function sheetConfirm(title, text, action, label) {
  openSheet(`<h2>${title}</h2><p class="hint">${text}</p>
    <div class="actions"><button class="btn btn-line" data-action="close">Cancel</button><button class="btn btn-plum" data-action="${action}" style="background:var(--rose)">${label}</button></div>`);
}

/* ---------- Doctor summary ---------- */
function buildReport() {
  const s = S.settings, ws = weightStats(), L = [];
  L.push(`Plume summary · ${fmtDate(new Date(), { month: "long", day: "numeric", year: "numeric" })}`);
  L.push("");
  L.push(`Medication: ${s.med}, current dose ${s.dose}, weekly on ${DAY_LONG[s.shotDay]}s`);
  const shots = [...S.shots].sort((a, b) => a.ts - b.ts);
  if (shots.length) {
    L.push(`Shots logged: ${shots.length} (first ${fmtDate(shots[0].ts)}, latest ${fmtDate(shots[shots.length - 1].ts)})`);
    let lastDose = null;
    shots.forEach(sh => { if (sh.dose !== lastDose) { L.push(`  • ${sh.dose} from ${fmtDate(sh.ts, { month: "short", day: "numeric", year: "numeric" })}`); lastDose = sh.dose; } });
    const gaps = shots.slice(1).map((sh, i) => (sh.ts - shots[i].ts) / DAY).filter(g => g > 9);
    if (gaps.length) L.push(`  Missed or late weeks: ${gaps.length}`);
  }
  L.push("");
  if (ws) {
    L.push(`Weight: ${fmtNum(ws.start)} → ${fmtNum(ws.cur)} ${s.unit} (${ws.lost >= 0 ? "−" : "+"}${fmtNum(Math.abs(ws.lost))} ${s.unit}) since ${fmtDate(ws.first.date + "T12:00", { month: "short", day: "numeric", year: "numeric" })}`);
    if (ws.goal) L.push(`Goal weight: ${fmtNum(ws.goal)} ${s.unit}`);
  }
  const days = Object.entries(S.days).filter(([k]) => parseDay(k) > Date.now() - 14 * DAY);
  if (days.length) {
    const avgP = days.reduce((a, [, d]) => a + (d.protein || 0), 0) / days.length;
    const avgW = days.reduce((a, [, d]) => a + (d.water || 0), 0) / days.length;
    L.push(`Last 14 days average: protein ${Math.round(avgP)} g/day (goal ${s.proteinGoal}), water ${fmtNum(avgW)} cups/day`);
  }
  L.push("");
  const recent = S.effects.filter(e => e.ts > Date.now() - 30 * DAY && e.type !== "great");
  if (recent.length) {
    L.push("Symptoms, last 30 days:");
    const g = {};
    recent.forEach(e => { (g[e.type] = g[e.type] || []).push(e); });
    Object.entries(g).sort((a, b) => b[1].length - a[1].length).forEach(([k, arr]) => {
      const def = EFFECTS.find(x => x.id === k) || { label: k };
      const strong = arr.filter(e => e.sev === 2).length;
      L.push(`  • ${def.label}: ${arr.length}×${strong ? ` (${strong} strong)` : ""}`);
    });
  } else L.push("Symptoms, last 30 days: none logged");
  L.push("");
  L.push("Logged by the patient in the Plume app. Not a medical record.");
  return L.join("\n");
}
async function shareReport() {
  const text = buildReport();
  const Share = window.Capacitor?.Plugins?.Share;
  try {
    if (Share) { await Share.share({ title: "My GLP-1 summary", text, dialogTitle: "Share summary" }); return; }
    if (navigator.share) { await navigator.share({ title: "My GLP-1 summary", text }); return; }
  } catch (e) { if (String(e).match(/cancel/i)) return; }
  openSheet(`<h2>Your summary</h2><p class="hint">Copy this and send it to your care team.</p>
    <textarea class="input" style="height:320px;font-size:13px;line-height:1.5" readonly>${esc(text)}</textarea>
    <div class="actions"><button class="btn btn-plum" data-action="copy-report">Copy</button></div>`);
}

/* ============================================================
   Reminders (Android notifications through Capacitor)
   ============================================================ */
async function syncReminders(askPermission) {
  const LN = window.Capacitor?.Plugins?.LocalNotifications;
  if (!LN) return true;
  try {
    const s = S.settings;
    if (askPermission && (s.remindShot || s.remindDaily)) {
      let p = await LN.checkPermissions();
      if (p.display !== "granted") p = await LN.requestPermissions();
      if (p.display !== "granted") { toast("Turn on notifications for Plume in Android settings"); return false; }
    }
    const pending = await LN.getPending();
    if (pending.notifications.length) await LN.cancel({ notifications: pending.notifications.map(n => ({ id: n.id })) });
    const list = [];
    const [h, m] = s.shotTime.split(":").map(Number);
    if (s.remindShot) list.push({
      id: 1, title: "It's shot day 💉", body: `${s.med} ${s.dose}. Suggested site: ${siteLabel(suggestedSite())}.`,
      schedule: { on: { weekday: s.shotDay + 1, hour: h, minute: m }, allowWhileIdle: true },
    });
    if (s.remindDaily) list.push({
      id: 2, title: "Quick check-in 🌙", body: "How did protein and water go today? Tap to log.",
      schedule: { on: { hour: 20, minute: 0 }, allowWhileIdle: true },
    });
    if (list.length) await LN.schedule({ notifications: list });
    return true;
  } catch (e) { console.warn("reminders", e); return true; }
}

/* ============================================================
   Actions
   ============================================================ */
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function addProtein(g) {
  if (!isFinite(g) || g === 0) return;
  const t = today(); t.protein = Math.max(0, t.protein + g);
  (t.pLog = t.pLog || []).push(g);
  save();
  if (t.protein >= S.settings.proteinGoal && t.protein - g < S.settings.proteinGoal) toast("Protein goal hit! 🎉");
  else toast(`+${g} g protein`);
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-action],[data-tab],[data-site]");
  if (!el) { if (ev.target.id === "backdrop") closeSheet(); return; }
  if (el.dataset.tab && !el.dataset.action) { tab = el.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  const a = el.dataset.action || (el.dataset.site ? "pick-site" : "");
  const v = el.dataset.v, s = S.settings;

  switch (a) {
    /* onboarding */
    case "ob-next": readObInputs(); obStep++; renderOnboarding(); window.scrollTo(0, 0); break;
    case "ob-back": readObInputs(); obStep = Math.max(0, obStep - 1); renderOnboarding(); break;
    case "ob-set": {
      readObInputs();
      const k = el.dataset.k;
      ob[k] = k === "shotDay" ? Number(v) : v;
      if (k === "med") ob.dose = (MEDS[v].doses[0] || "");
      renderOnboarding(); break;
    }
    case "ob-finish": {
      readObInputs();
      const w = parseFloat(String(ob.weight).replace(",", "."));
      Object.assign(S.settings, {
        name: ob.name || "", med: ob.med, dose: ob.dose || "—", shotDay: ob.shotDay, shotTime: ob.shotTime,
        unit: ob.unit, goalWeight: ob.goalWeight, proteinGoal: ob.proteinGoal, onboarded: true,
      });
      if (isFinite(w) && w > 0) S.weights.push({ id: uid(), date: dayKey(), value: w });
      save(); ob = null; obStep = 0; tab = "today"; render();
      syncReminders(true);
      break;
    }

    /* sheets */
    case "quick": sheetQuick(); break;
    case "close": closeSheet(); break;
    case "log-shot": sheetShot(); break;
    case "edit-shot": sheetShot(S.shots.find(x => x.id === el.dataset.id)); break;
    case "pick-site": sheetCtx.shot.site = el.dataset.site; refreshSitePicker(); break;
    case "pick-dose": sheetCtx.shot.dose = v; document.querySelectorAll("#dose-opts .opt").forEach(b => b.classList.toggle("on", b.dataset.v === v)); break;
    case "save-shot": {
      const sh = sheetCtx.shot;
      const when = new Date($("#shot-when").value);
      sh.ts = isNaN(when) ? Date.now() : Math.min(+when, Date.now() + 60000);
      sh.note = $("#shot-note").value.trim();
      if (el.dataset.id) { const i = S.shots.findIndex(x => x.id === el.dataset.id); if (i >= 0) S.shots[i] = { ...S.shots[i], ...sh }; }
      else S.shots.push({ id: uid(), ts: sh.ts, med: sh.med, dose: sh.dose, site: sh.site, note: sh.note });
      if (!el.dataset.id && sh.dose !== s.dose) s.dose = sh.dose;
      save(); closeSheet(); render(); syncReminders(false);
      toast(el.dataset.id ? "Shot updated" : "Shot logged. See you next week 💜");
      break;
    }
    case "del-shot": S.shots = S.shots.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Shot deleted"); break;

    case "log-weight": sheetWeight(); break;
    case "edit-weight": sheetWeight(S.weights.find(x => x.id === el.dataset.id)); break;
    case "save-weight": {
      const val = parseFloat($("#w-val").value.replace(",", "."));
      const date = $("#w-date").value || dayKey();
      if (!isFinite(val) || val <= 0 || val > 1500) { toast("Enter a valid weight"); break; }
      if (el.dataset.id) { const w = S.weights.find(x => x.id === el.dataset.id); if (w) { w.value = val; w.date = date; } }
      else {
        const same = S.weights.find(x => x.date === date);
        if (same) same.value = val; else S.weights.push({ id: uid(), date, value: val });
      }
      save(); closeSheet(); render(); toast("Weight saved");
      break;
    }
    case "del-weight": S.weights = S.weights.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Weigh-in deleted"); break;

    case "protein": addProtein(Number(v)); if (el.dataset.close) closeSheet(); render(); break;
    case "protein-custom": sheetProtein(); setTimeout(() => $("#p-val")?.focus(), 300); break;
    case "protein-save": { const g = parseInt($("#p-val").value, 10); if (g > 0) { addProtein(g); closeSheet(); render(); } else toast("Enter grams"); break; }
    case "protein-undo": {
      const t = today(); const g = (t.pLog || []).pop();
      if (g) { t.protein = Math.max(0, t.protein - g); save(); toast(`Removed ${g} g`); render(); closeSheet(); } else toast("Nothing to remove today");
      break;
    }
    case "water": { const t = today(); t.water = Math.max(0, Math.min(30, t.water + Number(v))); save(); render(); if (Number(v) > 0 && t.water === s.waterGoal) toast("Water goal hit! 💧"); break; }
    case "water-set": { const t = today(); const n = Number(v); t.water = t.water === n ? n - 1 : n; save(); render(); if (t.water === s.waterGoal) toast("Water goal hit! 💧"); break; }

    case "effect": sheetEffect(el.dataset.type); break;
    case "effect-pick": sheetEffectPick(); break;
    case "edit-effect": { const e = S.effects.find(x => x.id === el.dataset.id); if (e) sheetEffect(e.type, e); break; }
    case "pick-sev": sheetCtx.effect.sev = Number(v); document.querySelectorAll("#sheet .sev .opt").forEach(b => b.classList.toggle("on", b.dataset.v === v)); break;
    case "save-effect": {
      const e = sheetCtx.effect; e.note = $("#e-note").value.trim();
      if (el.dataset.id) { const x = S.effects.find(y => y.id === el.dataset.id); if (x) Object.assign(x, { sev: e.sev, note: e.note }); }
      else S.effects.push({ id: uid(), ts: Date.now(), type: e.type, sev: e.sev, note: e.note });
      save(); closeSheet(); render();
      toast(e.type === "great" ? "Love that ✨" : "Logged. Be gentle with yourself today.");
      break;
    }
    case "del-effect": S.effects = S.effects.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Deleted"); break;

    /* tabs inside screens */
    case "seg": histSeg = v; render(); break;
    case "range": range = v; render(); break;
    case "report": if (!s.pro) sheetPro(); else shareReport(); break;
    case "copy-report": { const ta = $("#sheet textarea"); try { await navigator.clipboard.writeText(ta.value); toast("Copied"); } catch (e) { ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy"); toast("Copied"); } break; }

    /* settings */
    case "edit-med": sheetMed(); break;
    case "med-pick": sheetCtx.med = v; sheetCtx.dose = (MEDS[v].doses[0] || ""); sheetCtx.redraw(); break;
    case "med-dose": sheetCtx.dose = v; sheetCtx.redraw(); break;
    case "med-save": { const c = $("#med-custom").value.trim(); s.med = sheetCtx.med; s.dose = c || sheetCtx.dose || "—"; save(); closeSheet(); render(); syncReminders(false); toast("Medication updated"); break; }
    case "edit-schedule": sheetSchedule(); break;
    case "sched-day": { const t = $("#sched-time").value; if (t) s.shotTime = t; sheetCtx.shotDay = Number(v); sheetCtx.redraw(); break; }
    case "sched-save": { s.shotDay = sheetCtx.shotDay; const t = $("#sched-time").value; if (t) s.shotTime = t; save(); closeSheet(); render(); syncReminders(false); toast("Shot day updated"); break; }
    case "edit-goals": sheetGoals(); break;
    case "goal-unit": {
      const p = parseInt($("#g-protein").value, 10), w = parseInt($("#g-water").value, 10);
      if (p > 0) s.proteinGoal = p; if (w > 0) s.waterGoal = Math.min(16, w);
      sheetCtx.unit = v; sheetCtx.redraw(); break;
    }
    case "goals-save": {
      const p = parseInt($("#g-protein").value, 10), w = parseInt($("#g-water").value, 10), g = parseFloat($("#g-weight").value.replace(",", "."));
      if (p > 0) s.proteinGoal = p;
      if (w > 0) s.waterGoal = Math.min(16, w);
      if (sheetCtx.unit !== s.unit) {
        S.weights.forEach(x => x.value = Math.round(convert(x.value, s.unit, sheetCtx.unit) * 10) / 10);
        s.unit = sheetCtx.unit;
      }
      s.goalWeight = isFinite(g) && g > 0 ? g : null;
      save(); closeSheet(); render(); toast("Goals saved");
      break;
    }
    case "edit-name": sheetName(); break;
    case "name-save": s.name = $("#n-val").value.trim(); save(); closeSheet(); render(); break;
    case "toggle": {
      const k = el.dataset.k; s[k] = !s[k]; save(); render();
      const ok = await syncReminders(s[k]);
      if (!ok) { s[k] = false; save(); render(); }
      else toast(s[k] ? "Reminder on 🔔" : "Reminder off");
      break;
    }
    case "pro": sheetPro(); break;
    case "buy":
      // TODO(Play Billing): replace with a real one-time in-app purchase before publishing.
      if (TEST_BUILD) { s.pro = true; save(); closeSheet(); render(); toast("Pro unlocked (test build) 💚"); }
      break;
    case "unpro": s.pro = false; save(); render(); toast("Pro turned off"); break;
    case "wipe": sheetConfirm("Delete everything?", "This removes all shots, weigh-ins, symptoms and settings from this phone. It can't be undone.", "wipe-yes", "Delete"); break;
    case "wipe-yes": {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      S = freshState(); closeSheet(); obStep = 0; ob = null; render(); syncReminders(false); break;
    }
  }
});
$("#backdrop").addEventListener("click", () => closeSheet());

// Keep the countdown fresh while the app is open, and catch up when it comes back from the background.
setInterval(() => { if (S.settings.onboarded && tab === "today" && !sheetOpen) render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !sheetOpen) render(); });

render();
</script>
